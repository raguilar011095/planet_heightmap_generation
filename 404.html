<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — World Orogen</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0E1824" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png">
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/tokens.css">
    <style>
        /* (a page on its own: the style guide's tokens, no app stylesheet; absolute paths, it answers any address) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--body); font-family: var(--font-ui);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; padding: 24px 16px;
        }
        .card { max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .mark { width: 64px; height: 64px; }
        .eyebrow { color: var(--gold-ink); font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.22em; text-transform: uppercase; }
        h1 { font: 500 52px/1.02 var(--font-display); color: var(--ink); text-wrap: balance; }
        h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
        p { font: 400 19px/1.5 var(--font-text); color: var(--body); }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
        a {
            display: inline-flex; align-items: center; min-height: var(--size-touch); padding: 0 var(--space-5);
            border-radius: var(--radius-md); border: var(--line-hair) solid var(--rule); background: var(--surface);
            color: var(--ink); font: 600 15px/1 var(--font-ui); text-decoration: none;
        }
        a.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="card">
        <img class="mark" src="/assets/brand/favicon.svg" alt="" width="64" height="64">
        <p class="eyebrow">Page not found</p>
        <h1>This planet doesn’t <em>exist yet.</em></h1>
        <p>Nothing lives at this address. Build a new world instead, or start from the Studio.</p>
        <div class="actions">
            <a class="primary" href="/generate">Build a new world</a>
            <a href="/">Go to the Studio</a>
        </div>
    </main>
</body>
</html>
